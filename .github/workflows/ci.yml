name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build Windows stdio launcher and smoke-test the full chain
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./platform/windows/Build.ps1
          node scripts/fake-peer-config.mjs "$env:TEMP/raft-adapter-fake.json"
          $env:RAFT_ADAPTER_CONFIG = "$env:TEMP/raft-adapter-fake.json"
          $env:MOCK_STATE_FILE = "$env:TEMP/raft-adapter-fake-sessions.json"
          node scripts/smoke.mjs --launcher
      - name: Smoke-test Windows install, PATH launch, and uninstall cycle
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          node scripts/fake-peer-config.mjs "$env:TEMP/raft-adapter-fake.json"
          $env:RAFT_ADAPTER_CONFIG = "$env:TEMP/raft-adapter-fake.json"
          $env:MOCK_STATE_FILE = "$env:TEMP/raft-adapter-fake-sessions.json"
          ./platform/windows/Install.ps1
          $adapterBin = (Resolve-Path ./bin).Path
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $adapterBin) { throw 'Install.ps1 did not add the adapter to the user PATH.' }
          $grok = Get-Command grok.exe -ErrorAction SilentlyContinue
          if (-not $grok -or $grok.Source -ine (Join-Path $adapterBin 'grok.exe')) { throw 'grok.exe does not resolve to this checkout after Install.ps1.' }
          node docker/probe.mjs --via-path --expect-models
          if ($LASTEXITCODE -ne 0) { throw 'Full chain through PATH grok failed.' }
          ./platform/windows/Uninstall.ps1
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $adapterBin) { throw 'Uninstall.ps1 left the adapter in the user PATH.' }
          if (Get-Command grok.exe -ErrorAction SilentlyContinue) { throw 'grok.exe still resolves after Uninstall.ps1.' }
          ./platform/windows/Install.ps1
          if (-not (Get-Command grok.exe -ErrorAction SilentlyContinue)) { throw 'grok.exe does not resolve after reinstalling.' }
      - name: Build Linux launcher and smoke-test the full chain
        if: runner.os == 'Linux'
        run: |
          platform/linux/build.sh
          node scripts/fake-peer-config.mjs /tmp/raft-adapter-fake.json
          RAFT_ADAPTER_CONFIG=/tmp/raft-adapter-fake.json MOCK_STATE_FILE=/tmp/raft-adapter-fake-sessions.json node scripts/smoke.mjs --launcher
          node scripts/fake-peer-config.mjs /tmp/raft-adapter-fake-dsh.json --backend dsh
          RAFT_ADAPTER_CONFIG=/tmp/raft-adapter-fake-dsh.json MOCK_STATE_FILE=/tmp/raft-adapter-fake-dsh-sessions.json RAFT_ADAPTER_LOCAL=/tmp/raft-adapter-fake-dsh-local node scripts/smoke.mjs --launcher
          RAFT_ADAPTER_CONFIG=/tmp/raft-adapter-fake-dsh.json MOCK_STATE_FILE=/tmp/raft-adapter-fake-dsh-sessions.json RAFT_ADAPTER_LOCAL=/tmp/raft-adapter-fake-dsh-local node docker/probe.mjs
      - name: Smoke-test Linux install, PATH launch, and uninstall cycle
        if: runner.os == 'Linux'
        run: |
          case ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) PATH="$HOME/.local/bin:$PATH"; export PATH ;; esac
          platform/linux/install.sh >/dev/null
          resolved=$(command -v grok || true)
          [ "$resolved" = "$HOME/.local/bin/grok" ] || { echo "grok resolves to '${resolved:-nothing}', expected $HOME/.local/bin/grok." >&2; exit 1; }
          grok --version
          RAFT_ADAPTER_CONFIG=/tmp/raft-adapter-fake.json MOCK_STATE_FILE=/tmp/raft-adapter-fake-sessions.json node docker/probe.mjs --via-path --expect-models
          platform/linux/uninstall.sh >/dev/null
          hash -r 2>/dev/null || true
          if [ -e "$HOME/.local/bin/grok" ] || command -v grok >/dev/null 2>&1; then echo 'uninstall left grok on PATH.' >&2; exit 1; fi
          platform/linux/install.sh >/dev/null
          resolved=$(command -v grok || true)
          [ "$resolved" = "$HOME/.local/bin/grok" ] || { echo "grok does not resolve to this checkout after reinstalling." >&2; exit 1; }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Linux dev/verification image without external downloads
        run: docker build -f docker/Dockerfile --build-arg INSTALL_DEVIN=0 --build-arg INSTALL_RAFT=0 -t raft-agent-adapter .
